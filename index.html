<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽奖转盘｜带批量概率回测</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.wheel-box{
  position:relative;
  width:min(90vw,420px);
  aspect-ratio: 1 / 1;
}
#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  display:block;
  transition:none;
}
.pointer{
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:36px solid #222;
  z-index:2
}
.batch-input{
  width:min(90vw,420px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
}
#addOneBtn,#add2Btn,#add3Btn,#add5Btn{
  padding:10px 14px;font-size:16px;border:none;background:#3498db;color:#fff;border-radius:8px;cursor:pointer;
}
#addOneBtn:disabled,#add2Btn:disabled,#add3Btn:disabled,#add5Btn:disabled{
  background:#999;
  cursor:not-allowed;
}
#setCountBtn{
  padding:10px 14px;font-size:16px;border:none;background:#2ecc71;color:#fff;border-radius:8px;cursor:pointer;
}
#setCountBtn:disabled{
  background:#999;
  cursor:not-allowed;
  border:none;
}
.remain-info{
  width:min(90vw,420px);
  font-size:18px;
  font-weight:bold;
  color:#c83c3c;
  text-align:center;
}
/*中奖播报样式*/
.broadcast-info{
  width:min(90vw,420px);
  font-size:20px;
  font-weight:bold;
  color:#d82c2c;
  text-align:center;
  min-height:28px;
}
#startBtn{
  width:min(90vw,420px);padding:12px;font-size:16px;border:none;
  background:#366ed8;color:#fff;border-radius:10px;cursor:pointer;
}
#startBtn:disabled{
  background:#999;
  cursor:not-allowed;
}
#resetBtn{
  width:min(90vw,420px);padding:10px;font-size:16px;border:none;
  background:#e67e22;color:#fff;border-radius:10px;cursor:pointer;
}
.total-score-box{
  width:min(90vw,420px);
  border:1px solid #ccc;
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}
.panel{width:min(90vw,420px)}
h3{margin:8px 0}
.record-box{
  width:min(90vw,420px);
  border:1px solid #ccc;
  padding:12px;
  border-radius:10px;
  max-height:240px;
  overflow-y:auto;
}
.record-item{font-size:14px;padding:3px 0;border-bottom:1px #eee solid}

/* 调试模式样式 */
.debug-login-box{
  width:min(90vw,420px);
  display:flex;gap:8px;align-items:center;
}
#debugPwdInput{
  flex:1;padding:8px;
}
#enterDebugBtn{
  padding:8px 12px;
  background:#666;color:#fff;border:none;border-radius:6px;cursor:pointer;
}
.debug-panel{
  width:min(90vw,420px);
  border:2px solid #8b2222;
  background:#fff2f2;
  padding:14px;
  border-radius:10px;
  display:none;
}
.debug-row{
  display:flex;align-items:center;gap:8px;margin:6px 0;
}
.debug-row label{width:80px;}
.debug-row input{flex:1;padding:6px;}
#saveWeightBtn{
  margin:8px 0;padding:8px 12px;background:#27ae60;color:white;border:none;border-radius:6px;
}
#exitDebugBtn{
  margin:8px 0;padding:8px 12px;background:#c0392b;color:white;border:none;border-radius:6px;
}
.expect-box{
  padding:8px 0;
  font-weight:bold;
  font-size:15px;
  color:#942222;
}
/* 批量回测区域 */
.sim-box{
  margin-top:12px;
  border:1px solid #999;
  padding:12px;
  border-radius:10px;
}
#simResult{
  white-space:pre-wrap;
  font-size:14px;
}
</style>
</head>
<body>
<div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
</div>
<div class="remain-info" id="remainInfo">剩余次数：0</div>
<!--新增中奖播报-->
<div class="broadcast-info" id="broadcastInfo"></div>
<div class="batch-input">
  <button id="addOneBtn">+1</button>
  <button id="add2Btn">+2</button>
  <button id="add3Btn">+3</button>
  <button id="add5Btn">+5</button>
  <button id="setCountBtn">确定</button>
</div>
<button id="startBtn" disabled>抽奖一次</button>
<button id="resetBtn">重置（清空次数+全部记录）</button>
<div class="total-score-box" id="totalScoreBox">总奖励：0</div>
<div class="panel">
    <h3>中奖记录</h3>
</div>
<div class="record-box">
  <div id="recordList"></div>
</div>

<!-- 调试模式登录入口 -->
<div class="debug-login-box">
  <input id="debugPwdInput" placeholder="输入调试密码" type="password">
  <button id="enterDebugBtn">进入调试模式</button>
</div>

<!-- 调试面板，默认隐藏 -->
<div class="debug-panel" id="debugPanel">
  <h3>🔧调试模式（可修改权重）</h3>
  <div class="debug-row">
    <label>5积分</label>
    <input type="number" id="w5" min="0">
  </div>
  <div class="debug-row">
    <label>10积分</label>
    <input type="number" id="w10" min="0">
  </div>
  <div class="debug-row">
    <label>20积分</label>
    <input type="number" id="w20" min="0">
  </div>
  <div class="debug-row">
    <label>50积分</label>
    <input type="number" id="w50" min="0">
  </div>
  <div class="debug-row">
    <label>100积分</label>
    <input type="number" id="w100" min="0">
  </div>
  <button id="saveWeightBtn">保存权重并更新转盘</button>
  <button id="exitDebugBtn">退出调试模式</button>

  <!--单次抽奖数学期望-->
  <div class="expect-box" id="expectBox">单次抽奖数学期望：--</div>

  <!-- 批量概率回测（只在调试面板内） -->
  <div class="sim-box">
    <h3>批量概率回测</h3>
    <div style="display:flex;gap:8px;margin:8px 0;">
      <input id="simCountInput" type="number" value="10000" min="100" style="flex:1;padding:8px;">
      <button id="simBtn">开始模拟</button>
    </div>
    <div id="simResult"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const maxSize = Math.min(window.innerWidth * 0.9, 420);
const dpr = window.devicePixelRatio || 1;
canvas.width = maxSize * dpr;
canvas.height = maxSize * dpr;
canvas.style.width = maxSize + "px";
canvas.style.height = maxSize + "px";
ctx.scale(dpr, dpr);
const wheelDom = document.getElementById("wheel");
const startBtn = document.getElementById('startBtn');
const addOneBtn = document.getElementById('addOneBtn');
const add2Btn = document.getElementById('add2Btn');
const add3Btn = document.getElementById('add3Btn');
const add5Btn = document.getElementById('add5Btn');
const setCountBtn = document.getElementById('setCountBtn');
const recordList = document.getElementById('recordList');
const resetBtn = document.getElementById('resetBtn');
const remainInfo = document.getElementById('remainInfo');
const broadcastInfo = document.getElementById('broadcastInfo');
const expectBox = document.getElementById('expectBox');
const totalScoreBox = document.getElementById('totalScoreBox');
const simBtn = document.getElementById("simBtn");
const simResult = document.getElementById("simResult");
const simCountInput = document.getElementById("simCountInput");

//调试相关DOM
const debugPwdInput = document.getElementById('debugPwdInput');
const enterDebugBtn = document.getElementById('enterDebugBtn');
const debugPanel = document.getElementById('debugPanel');
const saveWeightBtn = document.getElementById('saveWeightBtn');
const exitDebugBtn = document.getElementById('exitDebugBtn');
const w5 = document.getElementById('w5');
const w10 = document.getElementById('w10');
const w20 = document.getElementById('w20');
const w50 = document.getElementById('w50');
const w100 = document.getElementById('w100');
const DEBUG_PASSWORD = "990723";
let isDebugMode = false;

//奖项配置 默认权重：5积分80，10积分15，20积分6，50积分2，100积分0.8
let items = [
    {name:"5积分", weight:20},
    {name:"20积分", weight:6},
    {name:"5积分", weight:20},
    {name:"10积分", weight:15},
    {name:"5积分", weight:20},
    {name:"50积分", weight:2},
    {name:"5积分", weight:20},
    {name:"100积分", weight:0.8},
];

function getColorByName(name){
    if(name === "5积分") return "#a9d8f5";
    if(name === "10积分") return "#6fcf6f";
    if(name === "20积分") return "#f7d049";
    if(name === "50积分") return "#ff9f43";
    if(name === "100积分") return "#ff4d4d";
    return "#cccccc";
}
let spinning = false;
let currentRotate = 0;
let records = [];
let remainCount = 0;
let countConfirmed = false; //标记次数是否已经确认

//播报中奖，3秒自动清空
function showBroadcast(text){
    broadcastInfo.innerText = text;
    setTimeout(()=>{
        broadcastInfo.innerText = "";
    },3000);
}

//计算单次抽奖数学期望
function calcExpectation(){
    const totalW = items.reduce((sum,it)=>sum+it.weight,0);
    if(totalW <= 0) return 0;
    let e = 0;
    items.forEach(it=>{
        const num = parseInt(it.name);
        e += num * (it.weight / totalW);
    })
    return e;
}
//刷新期望显示
function refreshExpectUi(){
    const ev = calcExpectation();
    expectBox.innerText = `单次抽奖数学期望：${ev.toFixed(4)} 积分`;
}

function getPoint(str){
  const num = str.match(/\d+/);
  return num ? Number(num[0]) : 0;
}
function refreshRemain(){
  remainInfo.innerText = `剩余次数：${remainCount}`;
  if(!countConfirmed){
    startBtn.disabled = true;
  }else{
    startBtn.disabled = remainCount <= 0;
  }
}
function refreshTotalScore(){
  let totalPoint = 0;
  records.forEach(r=>{
    const p = getPoint(r.name);
    totalPoint += p;
  })
  totalScoreBox.innerText = `总奖励：${totalPoint}`;
}
function drawWheel(){
    ctx.clearRect(0,0,maxSize,maxSize);
    const totalWeight = items.reduce((s,i)=>s+i.weight, 0);
    if(totalWeight <= 0) return;
    let startAngle = -Math.PI / 2;
    const radius = maxSize / 2;
    items.forEach((item)=>{
        const sliceAngle = (item.weight / totalWeight) * Math.PI * 2;
        const color = getColorByName(item.name);
        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, startAngle, startAngle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle="#fff";
        ctx.lineWidth=2;
        ctx.stroke();
        ctx.save();
        ctx.translate(radius,radius);
        ctx.rotate(startAngle + sliceAngle/2);
        ctx.fillStyle="#222";
        ctx.font="bold 13px sans-serif";
        ctx.textAlign="center";
        ctx.fillText(item.name, radius*0.6, 4);
        ctx.restore();
        startAngle += sliceAngle;
    })
}

// 核心抽奖判定函数，输入旋转总角度，返回中奖奖品（和动画逻辑完全同源）
function doOneDraw(targetDeg){
    const totalWeight = items.reduce((s,i)=>s+i.weight,0);
    const rot = targetDeg % 360;
    let pointerOnWheel = (360 - rot + 360) % 360;
    let acc = 0;
    let result = null;
    for(let item of items){
        const sectorDeg = (item.weight / totalWeight) * 360;
        if(pointerOnWheel >= acc && pointerOnWheel < acc + sectorDeg){
            result = item;
            break;
        }
        acc += sectorDeg;
    }
    return result;
}

function refreshRecordUI(){
    recordList.innerHTML = "";
    records.forEach((r,idx)=>{
      const div = document.createElement("div");
      div.className = "record-item";
      div.innerText = `第${idx+1}次：${r.name}`;
      recordList.appendChild(div);
    })
    refreshTotalScore();
}

//调试模式：填充权重输入框
function fillDebugWeightInput(){
    let sum5=0,sum10=0,sum20=0,sum50=0,sum100=0;
    items.forEach(it=>{
        if(it.name==="5积分") sum5+=it.weight;
        if(it.name==="10积分") sum10+=it.weight;
        if(it.name==="20积分") sum20+=it.weight;
        if(it.name==="50积分") sum50+=it.weight;
        if(it.name==="100积分") sum100+=it.weight;
    })
    w5.value = sum5;
    w10.value = sum10;
    w20.value = sum20;
    w50.value = sum50;
    w100.value = sum100;
}

addOneBtn.onclick = function(){
    remainCount +=1;
    refreshRemain();
}
add2Btn.onclick = function(){
    remainCount +=2;
    refreshRemain();
}
add3Btn.onclick = function(){
    remainCount +=3;
    refreshRemain();
}
add5Btn.onclick = function(){
    remainCount +=5;
    refreshRemain();
}
setCountBtn.onclick = function(){
    if(remainCount <= 0){
        alert("请先添加抽奖次数");
        return;
    }
    countConfirmed = true;
    addOneBtn.disabled = true;
    add2Btn.disabled = true;
    add3Btn.disabled = true;
    add5Btn.disabled = true;
    setCountBtn.disabled = true;
    refreshRemain();
}

startBtn.onclick = async function(){
    if(spinning) return;
    if(!countConfirmed || remainCount <= 0){
        return;
    }
    //调试模式：直接计算最终角度，瞬间赋值，无动画，和真实抽奖使用同一套角度
    if(isDebugMode){
        const extraRandom = Math.random() * 360;
        const totalTurnDeg = 360 * 10 + extraRandom;
        const endDeg = currentRotate + totalTurnDeg;
        const resItem = doOneDraw(endDeg);
        if(!resItem) return;
        currentRotate = endDeg;
        wheelDom.style.transform = `rotate(${currentRotate}deg)`;

        records.push(resItem);
        refreshRecordUI();
        showBroadcast(`🎉本次中奖：${resItem.name}`);
        remainCount --;
        refreshRemain();
        return;
    }

    //普通模式，原有旋转动画
    spinning = true;
    startBtn.disabled = true;
    const extraRandom = Math.random() * 360;
    const totalTurnDeg = 360 * 10 + extraRandom;
    const endDeg = currentRotate + totalTurnDeg;
    const duration = 4000;
    const startTime = performance.now();
    function animate(now){
        const elapsed = now - startTime;
        let progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1-progress, 3);
        const deg = currentRotate + totalTurnDeg * ease;
        wheelDom.style.transform = `rotate(${deg}deg)`;
        if(progress < 1){
            requestAnimationFrame(animate);
        }else{
            currentRotate = endDeg;
            const resItem = doOneDraw(currentRotate);
            if(resItem){
                records.push(resItem);
                refreshRecordUI();
                showBroadcast(`🎉本次中奖：${resItem.name}`);
            }
            remainCount --;
            refreshRemain();
            spinning = false;
            refreshRemain();
        }
    }
    requestAnimationFrame(animate);
}

resetBtn.onclick = ()=>{
    records = [];
    remainCount = 0;
    currentRotate = 0;
    countConfirmed = false;
    wheelDom.style.transform = `rotate(0deg)`;
    broadcastInfo.innerText = "";
    addOneBtn.disabled = false;
    add2Btn.disabled = false;
    add3Btn.disabled = false;
    add5Btn.disabled = false;
    setCountBtn.disabled = false;
    refreshRemain();
    refreshRecordUI();
}

// ========== 批量模拟回测逻辑 ==========
simBtn.onclick = function(){
    const N = parseInt(simCountInput.value);
    if(isNaN(N) || N<100) {
        simResult.innerText = "请输入≥100的数字";
        return;
    }
    const stat = {
        "5积分":0,
        "10积分":0,
        "20积分":0,
        "50积分":0,
        "100积分":0
    };
    let dummyAngle = 0;
    for(let i=0;i<N;i++){
        const randExtra = Math.random()*360;
        const finalDeg = dummyAngle + 360*10 + randExtra;
        const prize = doOneDraw(finalDeg);
        stat[prize.name] +=1;
        dummyAngle = finalDeg;
    }
    let txt = `模拟总次数：${N}\n`;
    txt += `——————————————\n`;
    const totalW = items.reduce((s,i)=>s+i.weight,0);
    const theory = {
        "5积分": items.filter(x=>x.name==="5积分").reduce((s,it)=>s+it.weight,0)/totalW,
        "10积分":items.filter(x=>x.name==="10积分").reduce((s,it)=>s+it.weight,0)/totalW,
        "20积分":items.filter(x=>x.name==="20积分").reduce((s,it)=>s+it.weight,0)/totalW,
        "50积分":items.filter(x=>x.name==="50积分").reduce((s,it)=>s+it.weight,0)/totalW,
        "100积分":items.filter(x=>x.name==="100积分").reduce((s,it)=>s+it.weight,0)/totalW
    };
    for(let key in stat){
        const cnt = stat[key];
        const pct = (cnt / N *100).toFixed(2);
        const tpct = (theory[key]*100).toFixed(2);
        txt += `${key}：${cnt}次 | 实测${pct}% | 理论${tpct}%\n`;
    }
    simResult.innerText = txt;
}

//调试登录
enterDebugBtn.onclick = function(){
    const pwd = debugPwdInput.value.trim();
    if(pwd === DEBUG_PASSWORD){
        isDebugMode = true;
        debugPanel.style.display = "block";
        fillDebugWeightInput();
        refreshExpectUi();
        debugPwdInput.value = "";
    }else{
        alert("密码错误");
    }
}

//保存权重
saveWeightBtn.onclick = function(){
    const v5 = Number(w5.value)||0;
    const v10 = Number(w10.value)||0;
    const v20 = Number(w20.value)||0;
    const v50 = Number(w50.value)||0;
    const v100 = Number(w100.value)||0;
    if(v5+v10+v20+v50+v100 <=0){
        alert("权重总和不能为0");
        return;
    }
    //重建items数组，保持原来8个扇区结构，同奖项合并权重再拆分
    items = [
        {name:"5积分", weight:v5/4},
        {name:"20积分", weight:v20},
        {name:"5积分", weight:v5/4},
        {name:"10积分", weight:v10},
        {name:"5积分", weight:v5/4},
        {name:"50积分", weight:v50},
        {name:"5积分", weight:v5/4},
        {name:"100积分", weight:v100},
    ];
    drawWheel();
    refreshExpectUi();
    alert("权重已保存，转盘已更新");
}

exitDebugBtn.onclick = function(){
    isDebugMode = false;
    debugPanel.style.display = "none";
}

window.addEventListener('resize',()=>{
  const newSize = Math.min(window.innerWidth * 0.9, 420);
  const dpr = window.devicePixelRatio ||1;
  canvas.width = newSize*dpr;
  canvas.height = newSize*dpr;
  canvas.style.width = newSize+"px";
  canvas.style.height = newSize+"px";
  ctx.scale(dpr,dpr);
  drawWheel();
})
drawWheel();
refreshRecordUI();
refreshRemain();
</script>
</body>
</html>
