<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽奖转盘｜带批量概率回测</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.wheel-box{
  position:relative;
  width:min(90vw,420px);
  aspect-ratio: 1 / 1;
}
#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  display:block;
  transition:none;
}
.pointer{
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:36px solid #222;
  z-index:2
}
.batch-input{
  width:min(90vw,420px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
}
#addOneBtn,#add2Btn,#add3Btn,#add5Btn{
  padding:10px 14px;font-size:16px;border:none;background:#3498db;color:#fff;border-radius:8px;cursor:pointer;
}
#addOneBtn:disabled,#add2Btn:disabled,#add3Btn:disabled,#add5Btn:disabled{
  background:#999;
  cursor:not-allowed;
}
#setCountBtn{
  padding:10px 14px;font-size:16px;border:none;background:#2ecc71;color:#fff;border-radius:8px;cursor:pointer;
}
#setCountBtn:disabled{
  background:#999;
  cursor:not-allowed;
  border:none;
}
.remain-info{
  width:min(90vw,420px);
  font-size:18px;
  font-weight:bold;
  color:#c83c3c;
  text-align:center;
}
/*中奖播报样式*/
.broadcast-info{
  width:min(90vw,420px);
  font-size:20px;
  font-weight:bold;
  color:#d82c2c;
  text-align:center;
  min-height:28px;
}
#startBtn{
  width:min(90vw,420px);padding:12px;font-size:16px;border:none;
  background:#366ed8;color:#fff;border-radius:10px;cursor:pointer;
}
#startBtn:disabled{
  background:#999;
  cursor:not-allowed;
}
#resetBtn{
  width:min(90vw,420px);padding:10px;font-size:16px;border:none;
  background:#e67e22;color:#fff;border-radius:10px;cursor:pointer;
}
.total-score-box{
  width:min(90vw,420px);
  border:1px solid #ccc;
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}
.panel{width:min(90vw,420px)}
h3{margin:8px 0}
.record-box{
  width:min(90vw,420px);
  border:1px solid #ccc;
  padding:12px;
  border-radius:10px;
  max-height:240px;
  overflow-y:auto;
}
.record-item{font-size:14px;padding:3px 0;border-bottom:1px #eee solid}

/* 调试模式样式 */
.debug-login-box{
  width:min(90vw,420px);
  display:flex;gap:8px;align-items:center;
}
#debugPwdInput{
  flex:1;padding:8px;
}
#enterDebugBtn{
  padding:8px 12px;
  background:#666;color:#fff;border:none;border-radius:6px;cursor:pointer;
}
.debug-panel{
  width:min(90vw,420px);
  border:2px solid #8b2222;
  background:#fff2f2;
  padding:14px;
  border-radius:10px;
  display:none;
}
.debug-row{
  display:flex;align-items:center;gap:8px;margin:6px 0;
}
.debug-row label{width:80px;}
.debug-row input{flex:1;padding:6px;}
#saveWeightBtn{
  margin:8px 0;padding:8px 12px;background:#27ae60;color:white;border:none;border-radius:6px;
}
#exitDebugBtn{
  margin:8px 0;padding:8px 12px;background:#c0392b;color:white;border:none;border-radius:6px;
}
/* 权重持久化工具区 */
.weight-tools{
  display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;
}
.weight-tools button{
  padding:7px 10px;font-size:14px;border:none;border-radius:6px;cursor:pointer;color:#fff;background:#4a6fa5;
}
#restoreLibBtn{background:#7f8c8d}
#exportCfgBtn{background:#8e44ad}
#importCfgBtn{background:#8e44ad}
#copyCfgBtn{background:#16a085}
.weight-status{
  font-size:13px;color:#555;line-height:1.7;padding:6px 0;
  border-top:1px dashed #d9a7a7;
}
.weight-status b{color:#8b2222}
/* 自动同步到仓库 */
.sync-box{
  margin:10px 0 4px;padding:10px;border:1px dashed #8b2222;border-radius:8px;background:#fffafa;
}
.sync-title{font-size:14px;font-weight:bold;color:#8b2222;margin-bottom:6px;}
.sync-row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap;}
#ghTokenInput{flex:1;min-width:160px;padding:7px;font-size:13px;}
.sync-row button{padding:7px 10px;font-size:13px;border:none;border-radius:6px;cursor:pointer;color:#fff;background:#24292f;}
#ghClearBtn{background:#95a5a6;}
.sync-toggle{font-size:13px;display:flex;align-items:center;gap:6px;color:#333;}
.sync-status{font-size:12px;color:#555;line-height:1.6;word-break:break-all;}
.sync-status.ok{color:#1e8449;}
.sync-status.err{color:#c0392b;}
.expect-box{
  padding:8px 0;
  font-weight:bold;
  font-size:15px;
  color:#942222;
}
/* 批量回测区域 */
.sim-box{
  margin-top:12px;
  border:1px solid #999;
  padding:12px;
  border-radius:10px;
}
#simResult{
  white-space:pre-wrap;
  font-size:14px;
}
</style>
</head>
<body>
<div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
</div>
<div class="remain-info" id="remainInfo">剩余次数：0</div>
<!--新增中奖播报-->
<div class="broadcast-info" id="broadcastInfo"></div>
<div class="batch-input">
  <button id="addOneBtn">+1</button>
  <button id="add2Btn">+2</button>
  <button id="add3Btn">+3</button>
  <button id="add5Btn">+5</button>
  <button id="setCountBtn">确定</button>
</div>
<button id="startBtn" disabled>抽奖一次</button>
<button id="resetBtn">重置（清空次数+全部记录）</button>
<div class="total-score-box" id="totalScoreBox">总奖励：0</div>
<div class="panel">
    <h3>中奖记录</h3>
</div>
<div class="record-box">
  <div id="recordList"></div>
</div>

<!-- 调试模式登录入口 -->
<div class="debug-login-box">
  <input id="debugPwdInput" placeholder="输入调试密码" type="password">
  <button id="enterDebugBtn">进入调试模式</button>
</div>

<!-- 调试面板，默认隐藏 -->
<div class="debug-panel" id="debugPanel">
  <h3>🔧调试模式（可修改权重）</h3>
  <div class="debug-row">
    <label>5积分</label>
    <input type="number" id="w5" min="0">
  </div>
  <div class="debug-row">
    <label>10积分</label>
    <input type="number" id="w10" min="0">
  </div>
  <div class="debug-row">
    <label>20积分</label>
    <input type="number" id="w20" min="0">
  </div>
  <div class="debug-row">
    <label>50积分</label>
    <input type="number" id="w50" min="0">
  </div>
  <div class="debug-row">
    <label>100积分</label>
    <input type="number" id="w100" min="0">
  </div>
  <button id="saveWeightBtn">保存权重并更新转盘</button>

  <div class="weight-tools">
    <button id="restoreLibBtn">恢复库中配置</button>
    <button id="exportCfgBtn">导出 config.json</button>
    <button id="importCfgBtn">导入 config.json</button>
    <button id="copyCfgBtn">复制配置 JSON</button>
    <button id="exitDebugBtn">退出调试模式</button>
  </div>
  <input type="file" id="importCfgInput" accept=".json,application/json" style="display:none">

  <div class="sync-box">
    <div class="sync-title">自动同步到 GitHub 仓库</div>
    <div class="sync-row">
      <input id="ghTokenInput" type="password" placeholder="粘贴 GitHub Token（只存本机，不会进代码）" autocomplete="off">
      <button id="ghConnectBtn">连接</button>
    </div>
    <div class="sync-row">
      <label class="sync-toggle"><input type="checkbox" id="autoSyncChk"> 保存权重时自动提交到仓库</label>
      <button id="ghClearBtn">清除 Token</button>
    </div>
    <div class="sync-status" id="syncStatus">状态：未连接</div>
  </div>

  <div class="weight-status" id="weightStatus">权重来源：--</div>

  <!--单次抽奖数学期望-->
  <div class="expect-box" id="expectBox">单次抽奖数学期望：--</div>

  <!-- 批量概率回测（只在调试面板内） -->
  <div class="sim-box">
    <h3>批量概率回测</h3>
    <div style="display:flex;gap:8px;margin:8px 0;">
      <input id="simCountInput" type="number" value="10000" min="100" style="flex:1;padding:8px;">
      <button id="simBtn">开始模拟</button>
    </div>
    <div id="simResult"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const maxSize = Math.min(window.innerWidth * 0.9, 420);
const dpr = window.devicePixelRatio || 1;
canvas.width = maxSize * dpr;
canvas.height = maxSize * dpr;
canvas.style.width = maxSize + "px";
canvas.style.height = maxSize + "px";
ctx.scale(dpr, dpr);
const wheelDom = document.getElementById("wheel");
const startBtn = document.getElementById('startBtn');
const addOneBtn = document.getElementById('addOneBtn');
const add2Btn = document.getElementById('add2Btn');
const add3Btn = document.getElementById('add3Btn');
const add5Btn = document.getElementById('add5Btn');
const setCountBtn = document.getElementById('setCountBtn');
const recordList = document.getElementById('recordList');
const resetBtn = document.getElementById('resetBtn');
const remainInfo = document.getElementById('remainInfo');
const broadcastInfo = document.getElementById('broadcastInfo');
const expectBox = document.getElementById('expectBox');
const totalScoreBox = document.getElementById('totalScoreBox');
const simBtn = document.getElementById("simBtn");
const simResult = document.getElementById("simResult");
const simCountInput = document.getElementById("simCountInput");

//调试相关DOM
const debugPwdInput = document.getElementById('debugPwdInput');
const enterDebugBtn = document.getElementById('enterDebugBtn');
const debugPanel = document.getElementById('debugPanel');
const saveWeightBtn = document.getElementById('saveWeightBtn');
const exitDebugBtn = document.getElementById('exitDebugBtn');
const w5 = document.getElementById('w5');
const w10 = document.getElementById('w10');
const w20 = document.getElementById('w20');
const w50 = document.getElementById('w50');
const w100 = document.getElementById('w100');
const weightStatus = document.getElementById('weightStatus');
const restoreLibBtn = document.getElementById('restoreLibBtn');
const exportCfgBtn = document.getElementById('exportCfgBtn');
const importCfgBtn = document.getElementById('importCfgBtn');
const importCfgInput = document.getElementById('importCfgInput');
const copyCfgBtn = document.getElementById('copyCfgBtn');
const ghTokenInput = document.getElementById('ghTokenInput');
const ghConnectBtn = document.getElementById('ghConnectBtn');
const autoSyncChk = document.getElementById('autoSyncChk');
const ghClearBtn = document.getElementById('ghClearBtn');
const syncStatus = document.getElementById('syncStatus');
const DEBUG_PASSWORD = "990723";
let isDebugMode = false;

//奖项配置 默认权重：5积分80，10积分15，20积分6，50积分2，100积分0.8
//权重持久化：本浏览器已保存的权重 > 仓库根目录 config.json > 这里的内置默认
const STORAGE_KEY = "lotteryWheel.weights.v1";
const DEFAULT_WEIGHTS = {w5:80, w10:15, w20:6, w50:2, w100:0.8};
const WEIGHT_KEYS = ["w5","w10","w20","w50","w100"];
let libWeights = null;          // 从 config.json 读到的权重
let weightsSource = "内置默认";

function isValidWeights(w){
    if(!w || typeof w !== "object") return false;
    let sum = 0;
    for(const k of WEIGHT_KEYS){
        const v = Number(w[k]);
        if(!isFinite(v) || v < 0) return false;
        sum += v;
    }
    return sum > 0;
}
function normalizeWeights(w){
    const out = {};
    WEIGHT_KEYS.forEach(k=>{ out[k] = Number(w[k]); });
    return out;
}
//保持原来8个扇区结构，同一奖项的权重平均拆到它的每个扇区
function buildItems(w){
    return [
        {name:"5积分", weight:Number(w.w5)/4},
        {name:"20积分", weight:Number(w.w20)},
        {name:"5积分", weight:Number(w.w5)/4},
        {name:"10积分", weight:Number(w.w10)},
        {name:"5积分", weight:Number(w.w5)/4},
        {name:"50积分", weight:Number(w.w50)},
        {name:"5积分", weight:Number(w.w5)/4},
        {name:"100积分", weight:Number(w.w100)},
    ];
}
//把 items 再汇总回五档权重
function readWeightsFromItems(){
    const w = {w5:0,w10:0,w20:0,w50:0,w100:0};
    items.forEach(it=>{
        if(it.name==="5积分") w.w5 += it.weight;
        if(it.name==="10积分") w.w10 += it.weight;
        if(it.name==="20积分") w.w20 += it.weight;
        if(it.name==="50积分") w.w50 += it.weight;
        if(it.name==="100积分") w.w100 += it.weight;
    });
    return w;
}
function loadLocalWeights(){
    try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return null;
        const w = JSON.parse(raw);
        return isValidWeights(w) ? normalizeWeights(w) : null;
    }catch(e){ return null; }
}
function saveLocalWeights(w){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(w)); return true; }
    catch(e){ return false; }
}
function clearLocalWeights(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}
//读取仓库根目录的 config.json（用 file:// 直接打开时会失败，属正常）
async function fetchLibWeights(){
    try{
        const res = await fetch("./config.json?_=" + Date.now(), {cache:"no-store"});
        if(!res.ok) return null;
        const data = await res.json();
        const w = (data && data.weights) ? data.weights : data;
        return isValidWeights(w) ? normalizeWeights(w) : null;
    }catch(e){ return null; }
}
// ========== 权重自动同步到 GitHub 仓库（Token 只存本机，绝不写入代码） ==========
const GH_OWNER = "978912280-jpg";
const GH_REPO = "lottery-wheel";
const GH_BRANCH = "main";
const GH_CONFIG_PATH = "config.json";
const GH_TOKEN_KEY = "lotteryWheel.ghToken.v1";
const GH_AUTOSYNC_KEY = "lotteryWheel.autoSync.v1";

function getGhToken(){
    try{ return localStorage.getItem(GH_TOKEN_KEY) || ""; }catch(e){ return ""; }
}
function setGhToken(t){
    try{
        if(t) localStorage.setItem(GH_TOKEN_KEY, t);
        else localStorage.removeItem(GH_TOKEN_KEY);
        return true;
    }catch(e){ return false; }
}
function isAutoSync(){
    try{ return localStorage.getItem(GH_AUTOSYNC_KEY) === "1"; }catch(e){ return false; }
}
function setAutoSync(on){
    try{ localStorage.setItem(GH_AUTOSYNC_KEY, on ? "1" : "0"); }catch(e){}
}
function renderSyncStatus(html, kind){
    if(!syncStatus) return;
    syncStatus.className = "sync-status" + (kind ? " " + kind : "");
    if(html){ syncStatus.innerHTML = html; return; }
    const hasToken = !!getGhToken();
    syncStatus.innerHTML = hasToken
        ? `状态：<b style="color:#1e8449">已连接</b> ｜ 自动提交：<b>${isAutoSync() ? "开" : "关"}</b><br>目标：${GH_OWNER}/${GH_REPO} · ${GH_CONFIG_PATH}`
        : `状态：未连接 — 填入 Token 点「连接」后，保存权重会自动提交到仓库`;
}
// UTF-8 安全的 base64
function b64EncodeUnicode(str){
    return btoa(unescape(encodeURIComponent(str)));
}
function ghHeaders(token){
    return {
        "Authorization": "token " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
    };
}
async function verifyGhToken(token){
    const uRes = await fetch("https://api.github.com/user", {headers: ghHeaders(token)});
    if(!uRes.ok) throw new Error("Token 无效或无权限（HTTP " + uRes.status + "）");
    const user = await uRes.json();
    const rRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`, {headers: ghHeaders(token)});
    if(!rRes.ok) throw new Error("读不到仓库 " + GH_OWNER + "/" + GH_REPO + "（HTTP " + rRes.status + "）");
    const repo = await rRes.json();
    const perm = repo.permissions || {};
    if(!(perm.push || perm.admin || perm.maintain)){
        throw new Error("该 Token 对仓库没有写权限");
    }
    return {login: user.login, repo: repo.full_name};
}
// 把权重直接写入仓库的 config.json
async function commitWeightsToRepo(weights){
    const token = getGhToken();
    if(!token) throw new Error("尚未连接 GitHub");
    const api = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_CONFIG_PATH}`;
    let sha = null;
    const getRes = await fetch(api + "?ref=" + GH_BRANCH + "&_=" + Date.now(), {
        headers: ghHeaders(token), cache: "no-store"
    });
    if(getRes.ok){
        const data = await getRes.json();
        sha = data.sha;
    }else if(getRes.status !== 404){
        throw new Error("读取仓库 " + GH_CONFIG_PATH + " 失败（HTTP " + getRes.status + "）");
    }
    const stamp = new Date().toLocaleString("zh-CN", {hour12: false});
    const payload = {
        "$comment": "抽奖转盘权重配置：由网页调试模式自动提交，也可手动编辑；网页通过 http(s) 打开时作为默认权重",
        "updatedAt": new Date().toISOString(),
        "weights": normalizeWeights(weights)
    };
    const body = {
        message: `chore: 更新转盘权重 ${stamp}`,
        content: b64EncodeUnicode(JSON.stringify(payload, null, 2)),
        branch: GH_BRANCH
    };
    if(sha) body.sha = sha;
    const putRes = await fetch(api, {method: "PUT", headers: ghHeaders(token), body: JSON.stringify(body)});
    if(!putRes.ok){
        let msg = "HTTP " + putRes.status;
        try{ const e = await putRes.json(); if(e && e.message) msg = e.message; }catch(_){}
        throw new Error("提交失败：" + msg);
    }
    const out = await putRes.json();
    return (out && out.commit && out.commit.sha) ? out.commit.sha : "ok";
}

function applyWeights(w, source){
    items = buildItems(w);
    weightsSource = source;
    drawWheel();
    refreshExpectUi();
    renderWeightStatus();
}
function renderWeightStatus(){
    if(!weightStatus) return;
    const w = readWeightsFromItems();
    const total = WEIGHT_KEYS.reduce((s,k)=>s+Number(w[k]), 0);
    weightStatus.innerHTML = `权重来源：<b>${weightsSource}</b><br>`
      + `5积分 ${w.w5} ｜ 10积分 ${w.w10} ｜ 20积分 ${w.w20} ｜ 50积分 ${w.w50} ｜ 100积分 ${w.w100}`
      + `（合计 ${Number(total.toFixed(4))}）`;
}

let items = buildItems(DEFAULT_WEIGHTS);

function getColorByName(name){
    if(name === "5积分") return "#a9d8f5";
    if(name === "10积分") return "#6fcf6f";
    if(name === "20积分") return "#f7d049";
    if(name === "50积分") return "#ff9f43";
    if(name === "100积分") return "#ff4d4d";
    return "#cccccc";
}
let spinning = false;
let currentRotate = 0;
let records = [];
let remainCount = 0;
let countConfirmed = false; //标记次数是否已经确认

//播报中奖，3秒自动清空
function showBroadcast(text){
    broadcastInfo.innerText = text;
    setTimeout(()=>{
        broadcastInfo.innerText = "";
    },3000);
}

//计算单次抽奖数学期望
function calcExpectation(){
    const totalW = items.reduce((sum,it)=>sum+it.weight,0);
    if(totalW <= 0) return 0;
    let e = 0;
    items.forEach(it=>{
        const num = parseInt(it.name);
        e += num * (it.weight / totalW);
    })
    return e;
}
//刷新期望显示
function refreshExpectUi(){
    const ev = calcExpectation();
    expectBox.innerText = `单次抽奖数学期望：${ev.toFixed(4)} 积分`;
}

function getPoint(str){
  const num = str.match(/\d+/);
  return num ? Number(num[0]) : 0;
}
function refreshRemain(){
  remainInfo.innerText = `剩余次数：${remainCount}`;
  if(!countConfirmed){
    startBtn.disabled = true;
  }else{
    startBtn.disabled = remainCount <= 0;
  }
}
function refreshTotalScore(){
  let totalPoint = 0;
  records.forEach(r=>{
    const p = getPoint(r.name);
    totalPoint += p;
  })
  totalScoreBox.innerText = `总奖励：${totalPoint}`;
}
function drawWheel(){
    ctx.clearRect(0,0,maxSize,maxSize);
    const totalWeight = items.reduce((s,i)=>s+i.weight, 0);
    if(totalWeight <= 0) return;
    let startAngle = -Math.PI / 2;
    const radius = maxSize / 2;
    items.forEach((item)=>{
        const sliceAngle = (item.weight / totalWeight) * Math.PI * 2;
        const color = getColorByName(item.name);
        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, startAngle, startAngle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle="#fff";
        ctx.lineWidth=2;
        ctx.stroke();
        ctx.save();
        ctx.translate(radius,radius);
        ctx.rotate(startAngle + sliceAngle/2);
        ctx.fillStyle="#222";
        ctx.font="bold 13px sans-serif";
        ctx.textAlign="center";
        ctx.fillText(item.name, radius*0.6, 4);
        ctx.restore();
        startAngle += sliceAngle;
    })
}

// 核心抽奖判定函数，输入旋转总角度，返回中奖奖品（和动画逻辑完全同源）
function doOneDraw(targetDeg){
    const totalWeight = items.reduce((s,i)=>s+i.weight,0);
    const rot = targetDeg % 360;
    let pointerOnWheel = (360 - rot + 360) % 360;
    let acc = 0;
    let result = null;
    for(let item of items){
        const sectorDeg = (item.weight / totalWeight) * 360;
        if(pointerOnWheel >= acc && pointerOnWheel < acc + sectorDeg){
            result = item;
            break;
        }
        acc += sectorDeg;
    }
    return result;
}

function refreshRecordUI(){

startBtn.onclick = async function(){
    if(spinning) return;
    if(!countConfirmed || remainCount <= 0){
        return;
    }
    //调试模式：直接计算最终角度，瞬间赋值，无动画，和真实抽奖使用同一套角度
    if(isDebugMode){
        const extraRandom = Math.random() * 360;
        const totalTurnDeg = 360 * 10 + extraRandom;
        const endDeg = currentRotate + totalTurnDeg;
        const resItem = doOneDraw(endDeg);
        if(!resItem) return;
        currentRotate = endDeg;
        wheelDom.style.transform = `rotate(${currentRotate}deg)`;

        records.push(resItem);
        refreshRecordUI();
        showBroadcast(`🎉本次中奖：${resItem.name}`);
        remainCount --;
        refreshRemain();
        return;
    }

    //普通模式，原有旋转动画
    spinning = true;
    startBtn.disabled = true;
    const extraRandom = Math.random() * 360;
    const totalTurnDeg = 360 * 10 + extraRandom;
    const endDeg = currentRotate + totalTurnDeg;
    const duration = 4000;
    const startTime = performance.now();
    function animate(now){
        const elapsed = now - startTime;
        let progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1-progress, 3);
        const deg = currentRotate + totalTurnDeg * ease;
        wheelDom.style.transform = `rotate(${deg}deg)`;
        if(progress < 1){
            requestAnimationFrame(animate);
        }else{
            currentRotate = endDeg;
            const resItem = doOneDraw(currentRotate);
            if(resItem){
                records.push(resItem);
                refreshRecordUI();
                showBroadcast(`🎉本次中奖：${resItem.name}`);
            }
            remainCount --;
            refreshRemain();
            spinning = false;
            refreshRemain();
        }
    }
    requestAnimationFrame(animate);
}

resetBtn.onclick = ()=>{
    records = [];
    remainCount = 0;

// ========== 批量模拟回测逻辑 ==========
simBtn.onclick = function(){
    const N = parseInt(simCountInput.value);
    if(isNaN(N) || N<100) {
        simResult.innerText = "请输入≥100的数字";
        return;
    }
    const stat = {
        "5积分":0,
        "10积分":0,
        "20积分":0,
        "50积分":0,
        "100积分":0
    };
    let dummyAngle = 0;
    for(let i=0;i<N;i++){
        const randExtra = Math.random()*360;
        const finalDeg = dummyAngle + 360*10 + randExtra;
        const prize = doOneDraw(finalDeg);
        stat[prize.name] +=1;
        dummyAngle = finalDeg;
    }
    let txt = `模拟总次数：${N}\n`;
    txt += `——————————————\n`;
    const totalW = items.reduce((s,i)=>s+i.weight,0);
    const theory = {
        "5积分": items.filter(x=>x.name==="5积分").reduce((s,it)=>s+it.weight,0)/totalW,
        "10积分":items.filter(x=>x.name==="10积分").reduce((s,it)=>s+it.weight,0)/totalW,
        "20积分":items.filter(x=>x.name==="20积分").reduce((s,it)=>s+it.weight,0)/totalW,
        "50积分":items.filter(x=>x.name==="50积分").reduce((s,it)=>s+it.weight,0)/totalW,
        "100积分":items.filter(x=>x.name==="100积分").reduce((s,it)=>s+it.weight,0)/totalW
    };
    for(let key in stat){
        const cnt = stat[key];
        const pct = (cnt / N *100).toFixed(2);
        const tpct = (theory[key]*100).toFixed(2);
        txt += `${key}：${cnt}次 | 实测${pct}% | 理论${tpct}%\n`;
    }
    simResult.innerText = txt;
}

//保存权重（写入本机存储；已连接 GitHub 且开启自动提交时，同时提交到仓库 config.json）
saveWeightBtn.onclick = async function(){
    const v5 = Number(w5.value)||0;
    const v10 = Number(w10.value)||0;
    const v20 = Number(w20.value)||0;
    const v50 = Number(w50.value)||0;
    const v100 = Number(w100.value)||0;
    if(v5+v10+v20+v50+v100 <=0){
        alert("权重总和不能为0");
        return;
    }
    if([v5,v10,v20,v50,v100].some(v=>v<0)){
        alert("权重不能为负数");
        return;
    }
    const w = {w5:v5, w10:v10, w20:v20, w50:v50, w100:v100};
    //重建items数组，保持原来8个扇区结构，同奖项合并权重再拆分
    items = buildItems(w);
    drawWheel();
    refreshExpectUi();
    const ok = saveLocalWeights(w);
    weightsSource = ok ? "本浏览器已保存" : "仅本次生效（本地存储不可用）";
    renderWeightStatus();

    // —— 自动同步到仓库 ——
    if(isAutoSync() && getGhToken()){
        saveWeightBtn.disabled = true;
        renderSyncStatus("状态：正在提交到仓库…");
        try{
            const sha = await commitWeightsToRepo(w);
            weightsSource = "已保存并提交到仓库";
            renderWeightStatus();
            renderSyncStatus(`状态：<b>已提交</b>（${String(sha).slice(0,7)}），GitHub Pages 约 1 分钟后生效`, "ok");
            alert("权重已保存，并已提交到仓库 config.json。\n线上页面约 1 分钟后自动使用新权重。");
        }catch(e){
            renderSyncStatus("状态：提交失败 — " + e.message + "（权重仍已保存在本机浏览器）", "err");
            alert("权重已保存在本机，但提交仓库失败：\n" + e.message);
        }finally{
            saveWeightBtn.disabled = false;
        }
        return;
    }

    alert(ok
        ? "权重已保存，下次打开本网页会自动生效。\n如需自动同步到仓库，请在调试面板里填入 GitHub Token 并点「连接」。"
        : "浏览器本地存储不可用（可能处于隐私模式），权重仅本次生效。");
}

// —— 连接 GitHub / 自动提交开关 ——
ghConnectBtn.onclick = async function(){
    const token = (ghTokenInput.value || "").trim();
    if(!token){ alert("请先粘贴 GitHub Token"); return; }
    ghConnectBtn.disabled = true;
    renderSyncStatus("状态：正在校验 Token…");
    try{
        const info = await verifyGhToken(token);
        setGhToken(token);
        setAutoSync(true);
        autoSyncChk.checked = true;
        ghTokenInput.value = "";
        renderSyncStatus(`状态：<b>已连接</b>（${info.login}）｜ 自动提交：<b>开</b><br>保存权重时将自动提交到 ${info.repo} 的 ${GH_CONFIG_PATH}`, "ok");
    }catch(e){
        renderSyncStatus("状态：连接失败 — " + e.message + "<br>提示：Token 需具备 repo 写权限；建议用 Fine-grained Token，只授权本仓库 Contents: Read and write", "err");
    }finally{
        ghConnectBtn.disabled = false;
    }
}
autoSyncChk.onchange = function(){
    setAutoSync(autoSyncChk.checked);
    renderSyncStatus();
}
ghClearBtn.onclick = function(){
    setGhToken("");
    setAutoSync(false);
    autoSyncChk.checked = false;

}

    }

//导出 config.json：放到仓库根目录即可成为所有设备的默认权重
exportCfgBtn.onclick = function(){
    const w = readWeightsFromItems();
    const payload = {
        "$comment": "抽奖转盘权重配置：改完提交到仓库根目录 config.json，网页下次打开即以此为默认权重",
        "updatedAt": new Date().toISOString(),
        "weights": normalizeWeights(w)
    };
    const txt = JSON.stringify(payload, null, 2);
    const blob = new Blob([txt], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "config.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

//导入 config.json（文件名随意，内容需含五档权重）
importCfgBtn.onclick = function(){
    importCfgInput.value = "";
    importCfgInput.click();
}
importCfgInput.onchange = function(){
    const file = importCfgInput.files && importCfgInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
        try{
            const data = JSON.parse(String(reader.result));
            const w = (data && data.weights) ? data.weights : data;
            if(!isValidWeights(w)){
                alert("配置文件格式不正确：需要包含 w5 / w10 / w20 / w50 / w100 五档非负权重");
                return;
            }
            const ww = normalizeWeights(w);
            items = buildItems(ww);
            drawWheel();
            refreshExpectUi();
            saveLocalWeights(ww);
            weightsSource = "导入的配置文件";
            renderWeightStatus();
            fillDebugWeightInput();
            alert("配置已导入并保存到本浏览器，下次打开自动生效");
        }catch(e){
            alert("读取失败：不是合法的 JSON 文件");
        }
    };
    reader.readAsText(file);
}

//复制当前权重 JSON，方便直接粘贴到 GitHub 上的 config.json
copyCfgBtn.onclick = function(){
    const w = readWeightsFromItems();
    const txt = JSON.stringify({"weights": normalizeWeights(w)}, null, 2);
    const done = ()=>alert("当前权重 JSON 已复制，可直接粘贴到仓库 config.json 的 weights 字段");
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done).catch(()=>prompt("请手动复制以下内容：", txt));
    }else{
        prompt("请手动复制以下内容：", txt);
    }
}
